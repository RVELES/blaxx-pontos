                capture:
                  $ref: "#/components/schemas/capture"
                captured_amount:
                  $ref: "#/components/schemas/captured_amount"
                fixed_installments:
                  $ref: "#/components/schemas/fixed_installments"
                interest_type:
                  $ref: "#/components/schemas/interest_type"
                installments:
                  $ref: "#/components/schemas/installments"
                authorization_code:
                  $ref: "#/components/schemas/authorization_code"
                message:
                  $ref: "#/components/schemas/message"
                return_code:
                  $ref: "#/components/schemas/return_code"
                recurrent:
                  $ref: "#/components/schemas/recurrent"
                save_card:
                  $ref: "#/components/schemas/save_card"
                card_info:
                  $ref: "#/components/schemas/card_info"
                soft_descriptor:
                  $ref: "#/components/schemas/soft_descriptor"
                type:
                  $ref: "#/components/schemas/type"
              required:
                - installments
                - card_info
            pix:
              $ref: "#/components/schemas/pix"
    authorizeResponse:
      type: object
      required:
        - payer
        - payment
      properties:
        amount:
          $ref: "#/components/schemas/amount"
        description:
          $ref: "#/components/schemas/description"
        external_reference_id:
          $ref: "#/components/schemas/external_reference_id"
        payment_date_time:
          $ref: "#/components/schemas/payment_date_time"
        id:
          $ref: "#/components/schemas/id"
        payer:
          $ref: "#/components/schemas/payer"
        redirect_url:
          $ref: "#/components/schemas/redirect_url"
        status:
          $ref: "#/components/schemas/status"
        fraud_analysis:
          $ref: "#/components/schemas/fraud_analysis"
        payment:
          type: object
          properties:
            card:
              type: object
              properties:
                authenticate:
                  $ref: "#/components/schemas/authenticate"
                capture:
                  $ref: "#/components/schemas/capture"
                captured_amount:
                  $ref: "#/components/schemas/captured_amount"
                fixed_installments:
                  $ref: "#/components/schemas/fixed_installments"
                interest_type:
                  $ref: "#/components/schemas/interest_type"
                installments:
                  $ref: "#/components/schemas/installments"
                authorization_code:
                  $ref: "#/components/schemas/authorization_code"
                message:
                  $ref: "#/components/schemas/message"
                return_code:
                  $ref: "#/components/schemas/return_code"
